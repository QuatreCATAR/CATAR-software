name: CATAR Release + PyPI Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 1.3.0)"
        required: true
      publish_pypi:
        description: "Publier sur PyPI ? (true/false)"
        required: false
        default: "true"

jobs:
  release-and-publish:
    runs-on: ubuntu-latest

    steps:
    # -----------------------------
    # 1. Checkout du dépôt
    # -----------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # -----------------------------
    # 2. Génération du changelog
    # -----------------------------
    - name: Generate changelog
      id: changelog
      uses: metcalfc/changelog-generator@v4.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # -----------------------------
    # 3. Création du tag Git
    # -----------------------------
    - name: Create tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag v${{ github.event.inputs.version }}
        git push origin v${{ github.event.inputs.version }}

    # -----------------------------
    # 4. Build du package
    # -----------------------------
    - name: Install build tools
      run: |
        pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    # -----------------------------
    # 5. Publication sur PyPI
    # -----------------------------
    - name: Publish to PyPI
      if: ${{ github.event.inputs.publish_pypi == 'true' }}
      uses: pypa/gh-action-pypi-publish@v1.8.10
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    # -----------------------------
    # 6. Création du ZIP pour la release GitHub
    # -----------------------------
    - name: Create release archive
      run: |
        mkdir artifacts
        zip -r artifacts/CATAR-software-${{ github.event.inputs.version }}.zip . -x "*.git*"

    # -----------------------------
    # 7. Création de la release GitHub
    # -----------------------------
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: "CATAR-software v${{ github.event.inputs.version }}"
        body: ${{ steps.changelog.outputs.changelog }}
        files: |
          artifacts/*
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
