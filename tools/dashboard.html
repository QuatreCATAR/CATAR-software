<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CATAR Health Dashboard</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { margin-bottom: 5px; }
    .section { margin-top: 20px; }
    .ok { color: green; }
    .warn { color: #b8860b; }
    .err { color: red; }
  </style>
</head>
<body>

<h1>CATAR Health Dashboard</h1>
<p>État de l’environnement CATAR-software</p>

<div class="section">
  <h2>Résumé</h2>
  <p><strong>Date :</strong> <span id="date">–</span></p>
  <p><strong>Statut :</strong> <span id="status">–</span></p>
</div>

<div class="section">
  <h2>Succès</h2>
  <ul id="success"></ul>
</div>

<div class="section">
  <h2>Avertissements</h2>
  <ul id="warnings"></ul>
</div>

<div class="section">
  <h2>Erreurs</h2>
  <ul id="errors"></ul>
</div>

<script>
  // Charge le rapport JSON généré par doctor.py
  fetch('../output/doctor_report.json')
    .then(r => r.json())
    .then(report => {
      document.getElementById("date").textContent = report.date || "–";
      document.getElementById("status").textContent = report.status || "–";

      const s = document.getElementById("success");
      const w = document.getElementById("warnings");
      const e = document.getElementById("errors");

      (report.success || []).forEach(msg => {
        const li = document.createElement("li");
        li.textContent = msg;
        li.className = "ok";
        s.appendChild(li);
      });

      (report.warnings || []).forEach(msg => {
        const li = document.createElement("li");
        li.textContent = msg;
        li.className = "warn";
        w.appendChild(li);
      });

      (report.errors || []).forEach(msg => {
        const li = document.createElement("li");
        li.textContent = msg;
        li.className = "err";
        e.appendChild(li);
      });
    })
    .catch(() => {
      document.getElementById("status").textContent =
        "Impossible de charger le rapport JSON.";
    });
</script>

</body>
</html>
